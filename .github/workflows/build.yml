name: Build and portable distribution
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build WPF and backend; run all tests
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Publish and smoke-test portable Windows ZIP
        shell: pwsh
        env:
          DISTRIBUTION_VERIFIED_SHA: ${{ github.sha }}
        run: ./scripts/publish.ps1 -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: ArbitrageTrading-win-x64
          path: |
            artifacts/distribution/*.zip
            artifacts/distribution/*.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: tests/**/TestResults/*.trx
  linux-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Independent backend and non-WPF tests
        run: bash scripts/verify-backend.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-results
          path: tests/**/TestResults/*.trx
