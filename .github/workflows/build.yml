name: Build and portable distribution
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.WINDOWS_SIGNING_ENABLED == 'true' && vars.WINDOWS_SIGNING_RUNNER || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build WPF and backend; run all tests
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Distribution workspace tests
        shell: pwsh
        run: ./scripts/test-distribution-workspace.ps1
      - name: Focused signing checks (temporary untrusted identity; no production secrets)
        shell: pwsh
        run: ./scripts/test-distribution-signing.ps1
      - name: Publish unsigned snapshot
        if: github.event_name != 'push' || github.ref != 'refs/heads/main' || vars.WINDOWS_SIGNING_ENABLED != 'true'
        shell: pwsh
        env:
          DISTRIBUTION_VERIFIED_SHA: ${{ github.sha }}
        run: ./scripts/publish.ps1 -WorkRoot "${{ runner.temp }}/ArbitrageDistributionWork" -SkipTests -SigningMode Unsigned
      - name: Publish explicitly enabled signed snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          DISTRIBUTION_VERIFIED_SHA: ${{ github.sha }}
          CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          EXPECTED_PUBLISHER: ${{ vars.WINDOWS_EXPECTED_PUBLISHER }}
          SIGNTOOL_PATH: ${{ vars.WINDOWS_SIGNTOOL_PATH }}
        run: ./scripts/publish.ps1 -WorkRoot "${{ runner.temp }}/ArbitrageDistributionWork" -SkipTests -SigningMode Authenticode
      - name: Verify test-signed canonical package (never uploaded as main artifact)
        shell: pwsh
        env:
          DISTRIBUTION_VERIFIED_SHA: ${{ github.sha }}
        run: ./scripts/publish.ps1 -WorkRoot "${{ runner.temp }}/ArbitrageDistributionWork" -SkipTests -SigningMode TestEphemeral -OutputDirectory artifacts/distribution-test-signed
      - uses: actions/upload-artifact@v4
        with:
          name: ArbitrageTrading-win-x64
          path: |
            artifacts/distribution/*.zip
            artifacts/distribution/*.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: tests/**/TestResults/*.trx
  linux-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Independent backend and non-WPF tests
        run: bash scripts/verify-backend.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-results
          path: tests/**/TestResults/*.trx
